<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>RAMAH WEATHER</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family: Arial, sans-serif;

    background:
        radial-gradient(
            circle at top,
            #173554 0%,
            #08111f 45%,
            #040912 100%
        );

    color: white;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;
}

.container {

    width: 100%;

    max-width: 600px;

    text-align: center;
}

.title {

    font-size: 34px;

    font-weight: bold;

    letter-spacing: 2px;

    margin-bottom: 8px;
}

.subtitle {

    color: #9fb3c8;

    font-size: 15px;

    margin-bottom: 25px;
}

.status {

    display: inline-flex;

    align-items: center;

    gap: 8px;

    background: rgba(0,0,0,0.25);

    padding: 8px 16px;

    border-radius: 30px;

    margin-bottom: 20px;

    font-size: 14px;
}

.dot {

    width: 10px;

    height: 10px;

    border-radius: 50%;

    background: #777;
}

.dot.online {

    background: #00e676;

    box-shadow:
        0 0 10px #00e676;
}

.dot.offline {

    background: #ff1744;

    box-shadow:
        0 0 10px #ff1744;
}

.cards {

    display: grid;

    grid-template-columns: 1fr;

    gap: 16px;
}

.card {

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.10),
            rgba(255,255,255,0.04)
        );

    border: 1px solid rgba(255,255,255,0.10);

    border-radius: 22px;

    padding: 25px 20px;

    box-shadow:
        0 15px 35px rgba(0,0,0,0.30);

    backdrop-filter: blur(10px);
}

.icon {

    font-size: 38px;

    margin-bottom: 8px;
}

.label {

    color: #aebfd0;

    font-size: 16px;

    margin-bottom: 8px;
}

.value {

    font-size: 48px;

    font-weight: bold;

    line-height: 1.1;
}

.unit {

    font-size: 18px;

    color: #9fb3c8;

    margin-top: 8px;
}

.wind .value {

    color: #ff9800;

    text-shadow:
        0 0 15px rgba(255,152,0,0.35);
}

.temperature .value {

    color: #ff5252;

    text-shadow:
        0 0 15px rgba(255,82,82,0.30);
}

.humidity .value {

    color: #42a5f5;

    text-shadow:
        0 0 15px rgba(66,165,245,0.30);
}

.footer {

    margin-top: 25px;

    color: #71859a;

    font-size: 12px;
}

@media (min-width: 550px) {

    .cards {

        grid-template-columns:
            repeat(3, 1fr);
    }

    .card {

        padding: 22px 10px;
    }

    .value {

        font-size: 38px;
    }

}

</style>

</head>


<body>

<div class="container">

    <div class="title">
        RAMAH WEATHER
    </div>

    <div class="subtitle">
        محطة رماح للطقس
    </div>


    <div class="status">

        <span
            id="statusDot"
            class="dot">
        </span>

        <span id="statusText">
            جاري الاتصال...
        </span>

    </div>


    <div class="cards">


        <!-- ===================== -->
        <!-- WIND -->
        <!-- ===================== -->

        <div class="card wind">

            <div class="icon">
                🌪️
            </div>

            <div class="label">
                سرعة الرياح
            </div>

            <div
                id="windSpeed"
                class="value">
                -- 
            </div>

            <div class="unit">
                km/h
            </div>

        </div>


        <!-- ===================== -->
        <!-- TEMPERATURE -->
        <!-- ===================== -->

        <div class="card temperature">

            <div
