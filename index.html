<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>RAMAH WEATHER</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

min-height:100vh;

font-family:Arial,sans-serif;

background:
radial-gradient(
circle at top,
#173554 0%,
#08111f 45%,
#040912 100%
);

color:white;

display:flex;

justify-content:center;

align-items:flex-start;

padding-top:25px;

transition:background 1s ease;

}


/* ======================================
   البطاقة الرئيسية
====================================== */

.card{

width:350px;

padding:20px 25px 30px;

border-radius:25px;

text-align:center;

background:rgba(20,30,45,.82);

backdrop-filter:blur(12px);

-webkit-backdrop-filter:blur(12px);

border:1px solid rgba(255,255,255,.12);

box-shadow:0 15px 40px rgba(0,0,0,.5);

}


/* ======================================
   العنوان
====================================== */

h1{

margin:0 0 8px;

font-size:28px;

}

.subtitle{

font-size:16px;

color:#aebdcc;

margin-bottom:25px;

}


/* ======================================
   المربعات
====================================== */

.grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:12px;

}


.box{

padding:20px 8px;

border-radius:18px;

background:rgba(255,255,255,.06);

border:1px solid rgba(255,255,255,.08);

}


/* ======================================
   العناوين داخل المربعات
====================================== */

.label{

font-size:14px;

color:#aebdcc;

margin-bottom:10px;

}


/* ======================================
   القيم
====================================== */

.value{

font-size:34px;

font-weight:bold;

direction:ltr;

}


.wind{

color:#ffff00;

}


.temp{

color:#ff9d42;

}


.humidity{

color:#55c7ff;

}


.unit{

font-size:14px;

color:#bfc8d2;

}


/* ======================================
   التاريخ والوقت
====================================== */

.datetime{

font-size:18px;

font-weight:bold;

line-height:1.8;

color:white;

direction:rtl;

}


/* ======================================
   آخر قراءة
====================================== */

.time{

margin-top:15px;

font-size:13px;

color:#aebdcc;

}


/* ======================================
   معلومات
====================================== */

.info{

margin-top:15px;

font-size:12px;

color:#718096;

}

</style>

</head>


<body>


<div class="card">


<h1>
RAMAH WEATHER
</h1>


<div class="subtitle">
محطة رماح للطقس
</div>


<div class="grid">


<!-- ==================================
     سرعة الرياح
================================== -->

<div class="box">

<div class="label">
🌪️ سرعة الرياح
</div>

<div>

<span
id="wind"
class="value wind">

--

</span>

<span class="unit">
km/h
</span>

</div>

</div>


<!-- ==================================
     الحرارة
================================== -->

<div class="box">

<div class="label">
🌡️ الحرارة
</div>

<div>

<span
id="temperature"
class="value temp">

--

</span>

<span class="unit">
°C
</span>

</div>

</div>


<!-- ==================================
     الرطوبة
================================== -->

<div class="box">

<div class="label">
💧 الرطوبة
</div>

<div>

<span
id="humidity"
class="value humidity">

--

</span>

<span class="unit">
%
</span>

</div>

</div>


<!-- ==================================
     التاريخ والوقت
================================== -->

<div class="box">

<div class="label">
📅 التاريخ والوقت
</div>

<div
id="datetime"
class="datetime">

--

</div>

</div>


</div>


<!-- ==================================
     آخر قراءة
================================== -->

<div
id="time"
class="time">

آخر قراءة: --

</div>


<div class="info">

Firebase Live Data

</div>


</div>


<script>


// ======================================
// Firebase
// ======================================

const FIREBASE =
"https://rumah-wind-default-rtdb.asia-southeast1.firebasedatabase.app";


// ======================================
// قراءة Firebase
// ======================================

async function readFirebase(path){

const response =
await fetch(

FIREBASE +
path +
".json?_=" +
Date.now(),

{
cache:"no-store"
}

);

if(!response.ok){

throw new Error(
"HTTP " +
response.status
);

}

return await response.json();

}


// ======================================
// تحديث التاريخ والوقت
// مستقل تمامًا عن Firebase
// ======================================

function updateDateTime(){

const now =
new Date();


const dateText =
now.toLocaleDateString(
"ar-SA",
{
year:"numeric",
month:"2-digit",
day:"2-digit"
}
);


const timeText =
now.toLocaleTimeString(
"ar-SA",
{
hour:"2-digit",
minute:"2-digit",
second:"2-digit"
}
);


document.getElementById(
"datetime"
).innerHTML =

dateText +
"<br>" +
timeText;

}


// ======================================
// تحديث البيانات
// ======================================

async function updateWeather(){

try{


// ====================================
// سرعة الرياح
// ====================================

const windData =
await readFirebase(
"/windSpeed"
);


if(
windData !== null &&
windData !== undefined
){

const wind =
parseFloat(
windData
);


if(
!Number.isNaN(wind)
){

document.getElementById(
"wind"
).textContent =
wind.toFixed(2);

}

}


// ====================================
// الحرارة
// ====================================

const temperatureData =
await readFirebase(
"/weather/temperature"
);


if(
temperatureData !== null &&
temperatureData !== undefined
){

const temperature =
parseFloat(
temperatureData
);


if(
!Number.isNaN(temperature)
){

document.getElementById(
"temperature"
).textContent =
temperature.toFixed(1);

}

}


// ====================================
// الرطوبة
// ====================================

const humidityData =
await readFirebase(
"/weather/humidity"
);


if(
humidityData !== null &&
humidityData !== undefined
){

const humidity =
parseFloat(
humidityData
);


if(
!Number.isNaN(humidity)
){

document.getElementById(
"humidity"
).textContent =
humidity.toFixed(1);

}

}


// ====================================
// آخر قراءة
// ====================================

const lastSeen =
await readFirebase(
"/lastSeen"
);


if(
lastSeen !== null &&
lastSeen !== undefined
){

document.getElementById(
"time"
).textContent =

"آخر قراءة: " +

new Date(
Number(lastSeen)
).toLocaleTimeString(
"ar-SA",
{
hour:"2-digit",
minute:"2-digit",
second:"2-digit"
}
);

}


}
catch(error){

console.error(
"Firebase ERROR:",
error
);

}

}


// ======================================
// تشغيل أول مرة
// ======================================

updateDateTime();

updateWeather();


// ======================================
// الساعة والتاريخ
// كل ثانية
// ======================================

setInterval(
updateDateTime,
1000
);


// ======================================
// Firebase
// كل ثانيتين
// ======================================

setInterval(
updateWeather,
2000
);


</script>


</body>

</html>
