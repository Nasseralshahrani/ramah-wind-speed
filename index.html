<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>RAMAH WEATHER</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

min-height:100vh;

font-family:Arial,sans-serif;

background:
radial-gradient(
circle at top,
#173554 0%,
#08111f 45%,
#040912 100%
);

color:white;

display:flex;

justify-content:center;

align-items:flex-start;

padding-top:25px;

transition:background 1s ease;

}

.card{

width:350px;

padding:20px 25px 30px;

border-radius:25px;

text-align:center;

background:rgba(20,30,45,.82);

backdrop-filter:blur(12px);

-webkit-backdrop-filter:blur(12px);

border:1px solid rgba(255,255,255,.12);

box-shadow:0 15px 40px rgba(0,0,0,.5);

}

h1{

margin:0 0 8px;

font-size:28px;

}

.subtitle{

font-size:16px;

color:#aebdcc;

margin-bottom:25px;

}

.grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:12px;

}

.box{

padding:20px 8px;

border-radius:18px;

background:rgba(255,255,255,.06);

border:1px solid rgba(255,255,255,.08);

}

.label{

font-size:14px;

color:#aebdcc;

margin-bottom:10px;

}

.value{

font-size:34px;

font-weight:bold;

direction:ltr;

}

.wind{

color:#ffff00;

}

.temp{

color:#ff9d42;

}

.humidity{

color:#55c7ff;

}

.connection{

font-size:18px;

font-weight:bold;

}

.datetime{

font-size:17px;

font-weight:bold;

line-height:1.8;

color:white;

direction:ltr;

}

.unit{

font-size:14px;

color:#bfc8d2;

}

.status{

margin-top:25px;

font-size:16px;

}

.led{

display:inline-block;

width:12px;

height:12px;

border-radius:50%;

background:#777;

margin-left:8px;

}

.connected{

background:#00ff66;

box-shadow:0 0 12px #00ff66;

}

.error{

background:#ff3333;

box-shadow:0 0 12px #ff3333;

}

.time{

margin-top:15px;

font-size:13px;

color:#aebdcc;

}

.info{

margin-top:15px;

font-size:12px;

color:#718096;

}

</style>

</head>

<body>

<div class="card">

<h1>
RAMAH WEATHER
</h1>

<div class="subtitle">
محطة رماح للطقس
</div>

<div class="grid">


<!-- سرعة الرياح -->

<div class="box">

<div class="label">
🌪️ سرعة الرياح
</div>

<div>

<span
id="wind"
class="value wind">
--
</span>

<span class="unit">
km/h
</span>

</div>

</div>


<!-- الحرارة -->

<div class="box">

<div class="label">
🌡️ الحرارة
</div>

<div>

<span
id="temperature"
class="value temp">
--
</span>

<span class="unit">
°C
</span>

</div>

</div>


<!-- الرطوبة -->

<div class="box">

<div class="label">
💧 الرطوبة
</div>

<div>

<span
id="humidity"
class="value humidity">
--
</span>

<span class="unit">
%
</span>

</div>

</div>


<!-- التاريخ والوقت -->

<div class="box">

<div class="label">
📅 التاريخ والوقت
</div>

<div
id="datetime"
class="datetime">

--

</div>

</div>


</div>


<!-- الاتصال -->

<div class="status">

<span
id="led"
class="led">
</span>

<span id="status">
جاري الاتصال...
</span>

</div>


<!-- آخر قراءة -->

<div
id="time"
class="time">

آخر قراءة: --

</div>


<div class="info">
Firebase Live Data
</div>

</div>


<script>

// ======================================
// Firebase
// ======================================

const FIREBASE =
"https://rumah-wind-default-rtdb.asia-southeast1.firebasedatabase.app";


// ======================================
// قراءة Firebase
// ======================================

async function readFirebase(path){

const response =
await fetch(

FIREBASE +
path +
".json?_=" +
Date.now(),

{
cache:"no-store"
}

);

if(!response.ok){

throw new Error(
"HTTP " +
response.status
);

}

return await response.json();

}


// ======================================
// التاريخ والوقت
// الأرقام إنجليزية
// ======================================

function updateDateTime(){

const now =
new Date();


// التاريخ

const day =
String(
now.getDate()
).padStart(
2,
"0"
);

const month =
String(
now.getMonth() + 1
).padStart(
2,
"0"
);

const year =
now.getFullYear();


// الوقت

const hours =
String(
now.getHours()
).padStart(
2,
"0"
);

const minutes =
String(
now.getMinutes()
).padStart(
2,
"0"
);

const seconds =
String(
now.getSeconds()
).padStart(
2,
"0"
);


// عرض التاريخ والوقت

document.getElementById(
"datetime"
).innerHTML =

day +
"/" +
month +
"/" +
year +

"<br>" +

hours +
":" +
minutes +
":" +
seconds;

}


// ======================================
// تحديث بيانات الطقس
// ======================================

async function updateWeather(){

try{

// ====================================
// سرعة الرياح
// ====================================

const windData =
await readFirebase(
"/windSpeed"
);

if(
windData !== null &&
windData !== undefined
){

const wind =
parseFloat(
windData
);

if(
!Number.isNaN(wind)
){

document.getElementById(
"wind"
).textContent =
wind.toFixed(2);

}

}


// ====================================
// الحرارة
// ====================================

const temperatureData =
await readFirebase(
"/weather/temperature"
);

if(
temperatureData !== null &&
temperatureData !== undefined
){

const temperature =
parseFloat(
temperatureData
);

if(
!Number.isNaN(temperature)
){

document.getElementById(
"temperature"
).textContent =
temperature.toFixed(1);

}

}


// ====================================
// الرطوبة
// ====================================

const humidityData =
await readFirebase(
"/weather/humidity"
);

if(
humidityData !== null &&
humidityData !== undefined
){

const humidity =
parseFloat(
humidityData
);

if(
!Number.isNaN(humidity)
){

document.getElementById(
"humidity"
).textContent =
humidity.toFixed(1);

}

}


// ====================================
// lastSeen
// ====================================

const lastSeen =
await readFirebase(
"/lastSeen"
);

if(
lastSeen === null ||
lastSeen === undefined
){

throw new Error(
"lastSeen غير موجود"
);

}


// ====================================
// الاتصال
// ====================================

const age =
Date.now() -
Number(lastSeen);


if(age <= 15000){

document.getElementById(
"status"
).textContent =
"متصل";

document.getElementById(
"led"
).className =
"led connected";

}

else{

document.getElementById(
"status"
).textContent =
"غير متصل";

document.getElementById(
"led"
).className =
"led error";

}


// ====================================
// آخر قراءة
// ====================================

const lastDate =
new Date(
Number(lastSeen)
);


// أرقام إنجليزية

const lastHours =
String(
lastDate.getHours()
).padStart(
2,
"0"
);

const lastMinutes =
String(
lastDate.getMinutes()
).padStart(
2,
"0"
);

const lastSeconds =
String(
lastDate.getSeconds()
).padStart(
2,
"0"
);


document.getElementById(
"time"
).textContent =

"آخر قراءة: " +

lastHours +
":" +
lastMinutes +
":" +
lastSeconds;


// ====================================
// الخلفية حسب سرعة الرياح
// ====================================

const wind =
parseFloat(
windData
);

if(
!Number.isNaN(wind)
){

if(wind <= 10){

document.body.style.background =
"radial-gradient(circle at top,#173554 0%,#08111f 45%,#040912 100%)";

}

else if(wind <= 30){

document.body.style.background =
"radial-gradient(circle at top,#14532d 0%,#071a12 50%,#030806 100%)";

}

else if(wind <= 60){

document.body.style.background =
"radial-gradient(circle at top,#7c431c 0%,#241206 50%,#080402 100%)";

}

else{

document.body.style.background =
"radial-gradient(circle at top,#7f1d1d 0%,#250606 50%,#080101 100%)";

}

}

}

catch(error){

console.error(
"Firebase ERROR:",
error
);

document.getElementById(
"status"
).textContent =
"غير متصل";

document.getElementById(
"led"
).className =
"led error";

}

}


// ======================================
// تشغيل
// ======================================

updateDateTime();

updateWeather();


// ======================================
// تحديث التاريخ والوقت
// كل ثانية
// ======================================

setInterval(
updateDateTime,
1000
);


// ======================================
// تحديث Firebase
// كل ثانيتين
// ======================================

setInterval(
updateWeather,
2000
);

</script>

</body>

</html>
