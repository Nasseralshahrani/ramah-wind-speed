<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";


/* =================================
   FIREBASE CONFIG
================================= */

const firebaseConfig = {
    databaseURL:
        "https://naser-wynd-default-rtdb.europe-west1.firebasedatabase.app"
};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const weatherRef = ref(db, "/");


/* =================================
   VARIABLES
================================= */

let lastSeen = 0;

let currentWind = 0;

let currentTemperature = null;

let currentHumidity = null;


/* =================================
   ELEMENTS
================================= */

const mainTemperature =
    document.getElementById("mainTemperature");

const tempValue =
    document.getElementById("tempValue");

const humidityValue =
    document.getElementById("humidityValue");

const windValue =
    document.getElementById("windValue");

const mainWind =
    document.getElementById("mainWind");

const mainDate =
    document.getElementById("mainDate");

const lastUpdate =
    document.getElementById("lastUpdate");

const mainStatus =
    document.getElementById("mainStatus");

const mainStatusText =
    document.getElementById("mainStatusText");

const weatherDescription =
    document.getElementById("weatherDescription");

const weatherSymbol =
    document.getElementById("weatherSymbol");

const feelsTemperature =
    document.getElementById("feelsTemperature");

const gustValue =
    document.getElementById("gustValue");

const windDirection =
    document.getElementById("windDirection");


/* =================================
   TEMPERATURE
   Firebase → الموقع مباشرة
================================= */

function updateTemperature(temperature) {

    if (!Number.isFinite(temperature))
        return;

    currentTemperature = temperature;


    /*
       عرض درجة الحرارة كما تصل من Firebase
       مع التقريب لأقرب درجة.
    */

    const displayTemp =
        Math.round(temperature);


    mainTemperature.textContent =
        displayTemp;

    tempValue.textContent =
        displayTemp;

    feelsTemperature.textContent =
        displayTemp;


    updateWeatherDisplay();
}


/* =================================
   WEATHER DESCRIPTION
================================= */

function getWeatherDescription(
    temperature,
    humidity,
    wind
) {

    if (wind >= 60)
        return "رياح قوية";

    if (wind >= 35)
        return "رياح نشطة";

    if (temperature >= 45)
        return "أجواء شديدة الحرارة";

    if (temperature >= 35)
        return "أجواء حارة";

    if (temperature <= 10)
        return "أجواء باردة";

    if (humidity >= 80)
        return "رطوبة مرتفعة";

    return "سماء صافية";
}


/* =================================
   WEATHER ICON
================================= */

function getWeatherIcon(
    temperature,
    humidity,
    wind
) {

    if (wind >= 60)
        return "🌪️";

    if (wind >= 35)
        return "💨";

    if (humidity >= 80)
        return "🌧️";

    if (temperature >= 40)
        return "☀️";

    if (temperature <= 15)
        return "🌤️";

    return "☀️";
}


/* =================================
   WEATHER DISPLAY
================================= */

function updateWeatherDisplay() {

    if (currentTemperature === null)
        return;


    weatherDescription.textContent =
        getWeatherDescription(
            currentTemperature,
            currentHumidity ?? 0,
            currentWind
        );


    weatherSymbol.textContent =
        getWeatherIcon(
            currentTemperature,
            currentHumidity ?? 0,
            currentWind
        );
}


/* =================================
   WIND DIRECTION
================================= */

function updateWindDirection() {

    if (currentWind >= 60) {

        windDirection.textContent = "→";

    } else if (currentWind >= 35) {

        windDirection.textContent = "↗";

    } else {

        windDirection.textContent = "↑";
    }
}


/* =================================
   FIREBASE LIVE DATA
================================= */

onValue(

    weatherRef,

    (snapshot) => {

        const data = snapshot.val();


        console.log(
            "RAMAH WEATHER DATA:",
            data
        );


        if (!data) {

            setOffline();

            return;
        }


        /* =========================
           WIND
        ========================= */

        if (
            data.windSpeed !== undefined &&
            data.windSpeed !== null
        ) {

            const wind =
                Number(data.windSpeed);


            if (Number.isFinite(wind)) {

                currentWind =
                    wind;


                windValue.textContent =
                    wind.toFixed(1);


                mainWind.textContent =
                    wind.toFixed(1);


                gustValue.textContent =
                    Math.round(
                        wind * 1.35
                    );
            }
        }


        /* =========================
           TEMPERATURE
           Firebase مباشرة
        ========================= */

        if (
            data.temperature !== undefined &&
            data.temperature !== null
        ) {

            const temperature =
                Number(data.temperature);


            if (
                Number.isFinite(temperature) &&
                temperature >= -20 &&
                temperature <= 60
            ) {

                updateTemperature(
                    temperature
                );
            }
        }


        /* =========================
           HUMIDITY
        ========================= */

        if (
            data.humidity !== undefined &&
            data.humidity !== null
        ) {

            const humidity =
                Number(data.humidity);


            if (
                Number.isFinite(humidity) &&
                humidity >= 0 &&
                humidity <= 100
            ) {

                currentHumidity =
                    humidity;


                humidityValue.textContent =
                    humidity.toFixed(0) +
                    " %";
            }
        }


        /* =========================
           WEATHER
        ========================= */

        updateWeatherDisplay();


        /* =========================
           WIND DIRECTION
        ========================= */

        updateWindDirection();


        /* =========================
           LAST SEEN
        ========================= */

        if (
            data.lastSeen !== undefined &&
            data.lastSeen !== null
        ) {

            lastSeen =
                Number(data.lastSeen);


            const date =
                new Date(lastSeen);


            if (!isNaN(date.getTime())) {

                mainDate.textContent =
                    formatArabicDate(date);


                lastUpdate.textContent =
                    formatTime(date);
            }
        }


        /* =========================
           CONNECTION
        ========================= */

        checkConnection();

    },


    (error) => {

        console.error(
            "Firebase error:",
            error
        );

        setOffline();
    }
);


/* =================================
   CONNECTION CHECK
================================= */

function checkConnection() {

    if (!lastSeen) {

        setOffline();

        return;
    }


    const age =
        Date.now() - lastSeen;


    if (
        age >= 0 &&
        age <= 10000
    ) {

        mainStatus.classList.add(
            "online"
        );

        mainStatusText.textContent =
            "المحطة متصلة";

    } else {

        mainStatus.classList.remove(
            "online"
        );

        mainStatusText.textContent =
            "المحطة منقطعة";
    }
}


/* =================================
   OFFLINE
================================= */

function setOffline() {

    mainStatus.classList.remove(
        "online"
    );

    mainStatusText.textContent =
        "المحطة منقطعة";
}


/* =================================
   CONNECTION TIMER
================================= */

setInterval(
    checkConnection,
    2000
);


/* =================================
   ARABIC DATE
================================= */

function formatArabicDate(date) {

    const days = [
        "الأحد",
        "الاثنين",
        "الثلاثاء",
        "الأربعاء",
        "الخميس",
        "الجمعة",
        "السبت"
    ];


    const months = [
        "يناير",
        "فبراير",
        "مارس",
        "أبريل",
        "مايو",
        "يونيو",
        "يوليو",
        "أغسطس",
        "سبتمبر",
        "أكتوبر",
        "نوفمبر",
        "ديسمبر"
    ];


    return (
        days[date.getDay()] +
        "، " +
        date.getDate() +
        " " +
        months[date.getMonth()]
    );
}


/* =================================
   TIME
================================= */

function formatTime(date) {

    const h =
        String(
            date.getHours()
        ).padStart(2, "0");


    const m =
        String(
            date.getMinutes()
        ).padStart(2, "0");


    const s =
        String(
            date.getSeconds()
        ).padStart(2, "0");


    return (
        h +
        ":" +
        m +
        ":" +
        s
    );
}


/* =================================
   LIVE CLOCK
================================= */

setInterval(

    () => {

        if (lastSeen) {

            const date =
                new Date(lastSeen);


            if (!isNaN(date.getTime())) {

                lastUpdate.textContent =
                    formatTime(date);
            }
        }

    },

    1000
);


/* =================================
   THEME
================================= */

window.changeTheme = function () {

    document.body.style.background =
        "radial-gradient(circle at 50% -10%, #174e61 0%, #073445 35%, #031b27 70%, #02131c 100%)";


    setTimeout(

        () => {

            document.body.style.background =
                "radial-gradient(circle at 50% -10%, #0d4355 0%, #062b3a 30%, #031b27 65%, #02131c 100%)";

        },

        1200
    );
};


/* =================================
   SCROLL
================================= */

window.scrollToForecast = function () {

    document
        .getElementById("forecast")
        .scrollIntoView({
            behavior: "smooth"
        });
};

</script>
