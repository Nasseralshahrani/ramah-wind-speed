<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAMAH WIND SPEED</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#07111f;
    color:white;
    font-family:Arial,Tahoma,sans-serif;
}

.container{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:18px;
}

.header{
    text-align:center;
    padding:15px;
}

.header h1{
    margin:0;
    font-size:29px;
}

.header p{
    color:#9fb0c4;
    margin:8px 0;
}

.card{
    background:#142337;
    border-radius:28px;
    padding:30px 20px;
    margin-top:15px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
}

.label{
    color:#aebdce;
    font-size:18px;
}

.speed{
    font-size:82px;
    font-weight:bold;
    margin:15px 0 5px;
}

.unit{
    color:#aebdce;
    font-size:21px;
}

.status{
    margin:25px auto 15px;
    width:max-content;
    padding:11px 25px;
    border-radius:30px;
    background:#1d2c40;
    font-size:19px;
}

.online{
    color:#35e878;
    font-weight:bold;
}

.offline{
    color:#ff5555;
    font-weight:bold;
}

.update{
    color:#8291a5;
    font-size:14px;
}

.chart-card{
    background:#142337;
    border-radius:28px;
    padding:22px 15px;
    margin-top:18px;
    box-shadow:0 15px 40px rgba(0,0,0,.30);
}

.chart-title{
    text-align:center;
    font-size:19px;
    font-weight:bold;
    margin-bottom:15px;
}

.chart-box{
    width:100%;
    height:280px;
}

canvas{
    width:100%;
    height:100%;
}

.footer{
    text-align:center;
    color:#68788d;
    font-size:13px;
    padding:25px 0 10px;
}
