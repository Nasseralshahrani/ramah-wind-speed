<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAMAH WEATHER</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

min-height:100vh;

font-family:Arial,sans-serif;

background:
radial-gradient(
circle at top,
#173554 0%,
#08111f 45%,
#040912 100%
);

color:white;

display:flex;

justify-content:center;

align-items:flex-start;

padding-top:15px;

transition:background 1s ease;

}

.card{

width:350px;

padding:20px 25px 30px;

border-radius:25px;

text-align:center;

background:rgba(20,30,45,.82);

backdrop-filter:blur(12px);

-webkit-backdrop-filter:blur(12px);

border:1px solid rgba(255,255,255,.12);

box-shadow:0 15px 40px rgba(0,0,0,.5);

}

h1{

margin:0 0 6px;

font-size:18px;

}

.subtitle{

font-size:16px;

color:#aebdcc;

margin-bottom:25px;

}

.grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:12px;

}

.box{

padding:20px 8px;

border-radius:18px;

background:rgba(255,255,255,.06);

border:1px solid rgba(255,255,255,.08);

}

.label{

font-size:14px;

color:#aebdcc;

margin-bottom:10px;

}

.value{

font-size:34px;

font-weight:bold;

direction:ltr;

}

.wind{

color:#ffff00;

}

.temp{

color:#ff9d42;

}

.humidity{

color:#55c7ff;

}

.connection{

font-size:14px;

font-weight:bold;

}

.datetime{

font-size:17px;

font-weight:bold;

line-height:1.8;

color:white;

direction:ltr;

}

.unit{

font-size:14px;

color:#bfc8d2;

}

.status{

margin-top:20px;

font-size:13px;

}

.led{

display:inline-block;

width:9px;

height:9px;

border-radius:50%;

background:#777;

margin-left:6px;

}

.connected{

background:#00ff66;

box-shadow:0 0 9px #00ff66;

}

.error{

background:#ff3333;

box-shadow:0 0 9px #ff3333;

}

.time{

margin-top:15px;

font-size:13px;

color:#aebdcc;

}

.info{

margin-top:15px;

font-size:12px;

color:#718096;

}


/* ================================= */
/* توقعات الطقس */
/* ================================= */

#ramahForecast{

margin-top:20px;

padding:10px 5px;

width:100%;

background:rgba(255,255,255,.06);

border:1px solid rgba(255,255,255,.08);

border-radius:18px;

}

.forecast-title{

font-size:15px;

font-weight:bold;

margin-bottom:10px;

}

#forecastDays{

display:flex;

flex-direction:row;

gap:3px;

width:100%;

overflow-x:auto;

scrollbar-width:none;

}

#forecastDays::-webkit-scrollbar{

display:none;

}

.forecast-day{

flex:1;

min-width:70px;

text-align:center;

white-space:nowrap;

}

.forecast-name{

display:block;

font-size:11px;

font-weight:bold;

}

.forecast-icon{

display:block;

font-size:22px;

margin:4px 0;

}

.forecast-temp{

display:block;

font-size:13px;

font-weight:bold;

}

.forecast-wind{

display:block;

font-size:10px;

color:#bfc8d2;

margin-top:4px;

}

.forecast-gust{

display:block;

font-size:10px;

color:#ffffff;

margin-top:3px;

}

</style>

</head>

<body>

<div class="card">

<h1>
RUMAH WEATHER LIVE
</h1>

<div class="subtitle">
مباشر محطة رماح للطقس
</div>


<div class="grid">


<!-- سرعة الرياح -->

<div class="box">

<div class="label">
🌪️ سرعة الرياح
</div>

<div>

<span id="wind" class="value wind">
--
</span>

<span class="unit">
km/h
</span>

</div>

</div>


<!-- الحرارة -->

<div class="box">

<div class="label">
🌡️ الحرارة
</div>

<div>

<span id="temperature" class="value temp">
--
</span>

<span class="unit">
°C
</span>

</div>

</div>


<!-- الرطوبة -->

<div class="box">

<div class="label">
💧 الرطوبة
</div>

<div>

<span id="humidity" class="value humidity">
--
</span>

<span class="unit">
%
</span>

</div>

</div>


<!-- التاريخ والوقت -->

<div class="box">

<div class="label">
📅 التاريخ والوقت
</div>

<div id="datetime" class="datetime">

--

</div>

</div>


</div>


<!-- الاتصال -->

<div class="status">

<span id="led" class="led">
</span>

<span id="status">
جاري الاتصال...
</span>

</div>


<!-- آخر قراءة -->

<div id="time" class="time">

آخر قراءة: --

</div>


<div class="info">
Firebase Live Data
</div>


<!-- ================================= -->
<!-- توقعات الطقس -->
<!-- ================================= -->

<div id="ramahForecast">

<div class="forecast-title">
🌤️ توقعات الطقس لرماح
</div>

<div id="forecastDays"></div>

</div>


</div>


<!-- ====================================== -->
<!-- Firebase Realtime Database -->
<!-- ====================================== -->

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
getDatabase,
ref,
onValue
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";


const firebaseConfig = {

databaseURL:
"https://rumah-wind-default-rtdb.asia-southeast1.firebasedatabase.app"

};


const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);

const weatherRef =
ref(db, '/');


let connectionCheckInterval = null;


// ======================================
// استقبال بيانات Firebase
// ======================================

onValue(weatherRef, (snapshot) => {

const data = snapshot.val();

if (!data) return;


// ======================================
// سرعة الرياح
// ======================================

if (
data.windSpeed !== undefined &&
data.windSpeed !== null
) {

const wind =
parseFloat(data.windSpeed);

if (!isNaN(wind)) {

document.getElementById("wind")
.textContent =
wind.toFixed(2);


// ======================================
// تغيير الخلفية حسب سرعة الرياح
// ======================================

if (wind <= 10) {

document.body.style.background =
"radial-gradient(circle at top,#173554 0%,#08111f 45%,#040912 100%)";

}

else if (wind <= 30) {

document.body.style.background =
"radial-gradient(circle at top,#14532d 0%,#071a12 50%,#030806 100%)";

}

else if (wind <= 60) {

document.body.style.background =
"radial-gradient(circle at top,#7c431c 0%,#241206 50%,#080402 100%)";

}

else {

document.body.style.background =
"radial-gradient(circle at top,#7f1d1d 0%,#250606 50%,#080101 100%)";

}

}

}


// ======================================
// الحرارة والرطوبة
// ======================================

if (data.weather) {

if (
data.weather.temperature !== undefined &&
data.weather.temperature !== null
) {

const temp =
parseFloat(data.weather.temperature);

if (!isNaN(temp)) {

document.getElementById("temperature")
.textContent =
temp.toFixed(1);

}

}


if (
data.weather.humidity !== undefined &&
data.weather.humidity !== null
) {

const hum =
parseFloat(data.weather.humidity);

if (!isNaN(hum)) {

document.getElementById("humidity")
.textContent =
hum.toFixed(1);

}

}

}


// ======================================
// حالة الاتصال
// ======================================

if (data.lastSeen) {

const lastSeenTime =
Number(data.lastSeen);


const checkStatus = () => {

const age =
Date.now() - lastSeenTime;


if (age <= 10000) {

document.getElementById("status")
.textContent =
"متصل";

document.getElementById("led")
.className =
"led connected";

}

else {

document.getElementById("status")
.textContent =
"غير متصل";

document.getElementById("led")
.className =
"led error";

}

};


checkStatus();


if (connectionCheckInterval) {

clearInterval(
connectionCheckInterval
);

}


connectionCheckInterval =
setInterval(
checkStatus,
2000
);


// ======================================
// آخر قراءة
// ======================================

const lastDate =
new Date(lastSeenTime);

const lastHours =
String(
lastDate.getHours()
).padStart(2,"0");

const lastMinutes =
String(
lastDate.getMinutes()
).padStart(2,"0");

const lastSeconds =
String(
lastDate.getSeconds()
).padStart(2,"0");


document.getElementById("time")
.textContent =

"آخر قراءة: " +
lastHours +
":" +
lastMinutes +
":" +
lastSeconds;

}

});

</script>


<script>

// ======================================
// التاريخ والوقت المحلي
// ======================================

function updateDateTime(){

const now =
new Date();


const day =
String(
now.getDate()
).padStart(2,"0");


const month =
String(
now.getMonth() + 1
).padStart(2,"0");


const year =
now.getFullYear();


const hours =
String(
now.getHours()
).padStart(2,"0");


const minutes =
String(
now.getMinutes()
).padStart(2,"0");


const seconds =
String(
now.getSeconds()
).padStart(2,"0");


document.getElementById("datetime").innerHTML =

day +
"/" +
month +
"/" +
year +
"<br>" +
hours +
":" +
minutes +
":" +
seconds;

}


updateDateTime();

setInterval(
updateDateTime,
1000
);


// ======================================
// توقعات الطقس
// ======================================

async function loadForecast(){

const latitude =
25.5828380;

const longitude =
47.1852031;


const url =

`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}` +

`&daily=weather_code,temperature_2m_max,temperature_2m_min,wind_speed_10m_max,wind_gusts_10m_max` +

`&timezone=Asia%2FRiyadh`;


try{

const response =
await fetch(url);


if(!response.ok){

throw new Error(
"Forecast HTTP " +
response.status
);

}


const data =
await response.json();


const container =
document.getElementById(
"forecastDays"
);


const days = [

"الأحد",
"الاثنين",
"الثلاثاء",
"الأربعاء",
"الخميس",
"الجمعة",
"السبت"

];


container.innerHTML = "";


for(let i = 0; i < 7; i++){

const date =
new Date(
data.daily.time[i] +
"T00:00:00"
);


const max =
Math.round(
data.daily.temperature_2m_max[i]
);


const min =
Math.round(
data.daily.temperature_2m_min[i]
);


const wind =
Math.round(
data.daily.wind_speed_10m_max[i]
);


const gust =
Math.round(
data.daily.wind_gusts_10m_max[i]
);


const icon =
weatherIcon(
data.daily.weather_code[i]
);


container.innerHTML += `

<div class="forecast-day">

<span class="forecast-name">
${days[date.getDay()]}
</span>

<span class="forecast-icon">
${icon}
</span>

<span class="forecast-temp">
${max}° / ${min}°
</span>

<span class="forecast-wind">
🌪️ ${wind} km/h
</span>

<span class="forecast-gust">
هبات ${gust} km/h
</span>

</div>

`;

}

}

catch(error){

console.error(
"خطأ في توقعات الطقس:",
error
);

}

}


// ======================================
// أيقونات الطقس
// ======================================

function weatherIcon(code){

if(code === 0)
return "☀️";

if(code === 1 || code === 2)
return "🌤️";

if(code === 3)
return "☁️";

if(code >= 45 && code <= 48)
return "🌫️";

if(code >= 51 && code <= 67)
return "🌧️";

if(code >= 71 && code <= 77)
return "❄️";

if(code >= 80 && code <= 82)
return "🌦️";

if(code >= 95)
return "⛈️";

return "🌤️";

}


// ======================================
// تشغيل التوقعات
// ======================================

loadForecast();

setInterval(
loadForecast,
60 * 60 * 1000
);

</script>

</body>

</html>
