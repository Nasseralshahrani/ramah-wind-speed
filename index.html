<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAMAH WIND SPEED</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:
    radial-gradient(
        circle at top,
        #173554 0%,
        #08111f 45%,
        #040912 100%
    );
    color:#fff;
    font-family:Arial,Tahoma,sans-serif;
}

.container{
    width:100%;
    max-width:720px;
    margin:auto;
    padding:22px 16px 30px;
}

/* HEADER */

.header{
    text-align:center;
    padding:12px 0 8px;
}

.wind-logo{
    width:92px;
    height:92px;
    margin:0 auto 12px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;

    background:
    linear-gradient(
        145deg,
        #1d4d70,
        #0a1b2c
    );

    box-shadow:
    0 0 0 1px rgba(70,190,255,.18),
    0 12px 35px rgba(0,0,0,.4),
    inset 0 0 25px rgba(50,190,255,.12);
}

.wind-logo::before,
.wind-logo::after{
    content:"";
    position:absolute;
    border:2px solid #42d9ff;
    border-right-color:transparent;
    border-radius:50%;
    transform:rotate(-25deg);
}

.wind-logo::before{
    width:48px;
    height:25px;
}

.wind-logo::after{
    width:62px;
    height:32px;
    opacity:.55;
}

.logo-center{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#42d9ff;
    box-shadow:0 0 14px #42d9ff;
    z-index:2;
}

.title{
    font-size:28px;
    font-weight:bold;
    letter-spacing:1px;
    margin-top:8px;
}

.subtitle{
    color:#8db5cf;
    font-size:14px;
    margin-top:6px;
}

/* CONNECTION */

.connection{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin:18px 0;
    color:#a8c4d5;
    font-size:13px;
}

.status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#777;
    box-shadow:0 0 8px rgba(255,255,255,.2);
}

.status-dot.online{
    background:#28e88a;
    box-shadow:0 0 10px rgba(40,232,138,.8);
}

.status-dot.error{
    background:#ff4d5d;
    box-shadow:0 0 10px rgba(255,77,93,.7);
}

/* MAIN CARD */

.card{
    background:
    linear-gradient(
        145deg,
        rgba(22,53,78,.92),
        rgba(5,15,27,.94)
    );

    border:1px solid rgba(77,175,220,.18);
    border-radius:24px;

    box-shadow:
    0 18px 45px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.04);

    padding:24px;
    margin-bottom:18px;
}
