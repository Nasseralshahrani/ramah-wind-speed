<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>RAMAH WIND SPEED</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

min-height:100vh;

font-family:Arial,sans-serif;

background:
radial-gradient(
circle at top,
#173554 0%,
#08111f 45%,
#040912 100%
);

color:white;

display:flex;

justify-content:center;

align-items:center;

transition:background 1s ease;

}

.card{

width:320px;

padding:40px 25px;

border-radius:25px;

text-align:center;

background:rgba(20,30,45,.80);

backdrop-filter:blur(12px);

-webkit-backdrop-filter:blur(12px);

border:1px solid rgba(255,255,255,.12);

box-shadow:0 15px 40px rgba(0,0,0,.5);

position:relative;

}

h1{

margin:0 0 8px;

font-size:27px;

}

.subtitle{

font-size:16px;

color:#aebdcc;

margin-bottom:30px;

}

.speed{

font-size:70px;

font-weight:bold;

line-height:1;

direction:ltr;

}

.unit{

font-size:25px;

color:#bfc8d2;

margin-right:8px;

}

.status{

margin-top:30px;

font-size:16px;

}

.led{

display:inline-block;

width:12px;

height:12px;

border-radius:50%;

background:#777;

margin-left:8px;

vertical-align:middle;

}

.connected{

background:#00ff66;

box-shadow:0 0 12px #00ff66;

}

.error{

background:#ff3333;

box-shadow:0 0 12px #ff3333;

}

.time{

margin-top:15px;

font-size:13px;

color:#aebdcc;

}

.info{

margin-top:15px;

font-size:12px;

color:#718096;

}

</style>

</head>


<body>


<div class="card">

<h1>
RAMAH WIND SPEED
</h1>

<div class="subtitle">
سرعة الرياح الحالية
</div>


<div>

<span
id="speed"
class="speed">
--
</span>

<span class="unit">
RPM
</span>

</div>


<div class="status">

<span
id="led"
class="led">
</span>

<span id="status">
جاري الاتصال...
</span>

</div>


<div
id="time"
class="time">
آخر قراءة: --
</div>


<div class="info">
ThingSpeak Channel: 3455315
</div>

</div>



<script>


// =====================================
// إعدادات ThingSpeak
// =====================================

const CHANNEL_ID = "3455315";

const READ_API_KEY = "XKI2TU4LEPG0C9YN";

const FIELD = "1";


// =====================================
// رابط API
// =====================================

const API_URL =
`https://api.thingspeak.com/channels/${CHANNEL_ID}/fields/${FIELD}.json?api_key=${READ_API_KEY}&results=1`;


// =====================================
// عناصر الصفحة
// =====================================

const speedElement =
document.getElementById("speed");

const statusElement =
document.getElementById("status");

const ledElement =
document.getElementById("led");

const timeElement =
document.getElementById("time");


// =====================================
// جلب البيانات
// =====================================

async function getWindSpeed(){

try{

const response =
await fetch(
API_URL,
{
cache:"no-store"
}
);


if(!response.ok){

throw new Error(
"HTTP " + response.status
);

}


const data =
await response.json();


console.log(
"ThingSpeak:",
data
);


if(
!data.feeds ||
data.feeds.length === 0
){

throw new Error(
"لا توجد بيانات"
);

}


const feed =
data.feeds[0];


const value =
feed[`field${FIELD}`];


const rpm =
parseFloat(value);


if(Number.isNaN(rpm)){

throw new Error(
"قيمة غير صالحة"
);

}


// =====================================
// عرض السرعة
// =====================================

speedElement.textContent =
rpm.toFixed(1);


// =====================================
// حالة الاتصال
// =====================================

statusElement.textContent =
"متصل";

ledElement.className =
"led connected";


// =====================================
// وقت آخر قراءة من ThingSpeak
// =====================================

if(feed.created_at){

const date =
new Date(feed.created_at);

timeElement.textContent =
"آخر قراءة: " +
date.toLocaleTimeString(
"ar-SA",
{
hour:"2-digit",
minute:"2-digit",
second:"2-digit"
}
);

}


// =====================================
// لون الخلفية حسب السرعة
// =====================================

if(rpm <= 10){

document.body.style.background =
"radial-gradient(circle at top,#173554 0%,#08111f 45%,#040912 100%)";

}

else if(rpm <= 30){

document.body.style.background =
"radial-gradient(circle at top,#14532d 0%,#071a12 50%,#030806 100%)";

}

else if(rpm <= 60){

document.body.style.background =
"radial-gradient(circle at top,#7c431c 0%,#241206 50%,#080402 100%)";

}

else{

document.body.style.background =
"radial-gradient(circle at top,#7f1d1d 0%,#250606 50%,#080101 100%)";

}


}

catch(error){

console.error(
"ThingSpeak Error:",
error
);

statusElement.textContent =
"خطأ في الاتصال";

ledElement.className =
"led error";

}

}


// =====================================
// تشغيل مباشر
// =====================================

getWindSpeed();


// =====================================
// تحديث كل 5 ثوانٍ
// =====================================

setInterval(
getWindSpeed,
5000
);


</script>

</body>

</html>
