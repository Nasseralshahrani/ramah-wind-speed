<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAMAH WIND SPEED</title>

<style>
body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#08111f;
color:white;
font-family:Arial,Tahoma,sans-serif;
}
.box{text-align:center}
.title{font-size:24px;margin-bottom:25px}
.speed{font-size:90px;font-weight:bold;color:#42d9ff}
.unit{font-size:20px;color:#9dbbca}
.status{margin-top:25px}
</style>
</head>

<body>

<div class="box">

<div class="title">
RAMAH WIND SPEED
</div>

<div>
<span id="speed" class="speed">--</span>
</div>

<div class="unit">
RPM
</div>

<div id="status" class="status">
جاري الاتصال...
</div>

</div>

<script>

const CHANNEL_ID="3455315";
const FIELD_ID="1";

async function getSpeed(){

try{

const url=
`https://api.thingspeak.com/channels/${CHANNEL_ID}/fields/${FIELD_ID}/last.json?_=${Date.now()}`;

const response=await fetch(url);

if(!response.ok) throw new Error();

const data=await response.json();

const speed=parseFloat(data[`field${FIELD_ID}`]);

if(isNaN(speed)) throw new Error();

document.getElementById("speed").textContent=
speed.toFixed(0);

document.getElementById("status").textContent=
"متصل";

}

catch(error){

document.getElementById("status").textContent=
"غير متصل";

}

}

getSpeed();

setInterval(getSpeed,15000);

</script>

</body>
</html>
