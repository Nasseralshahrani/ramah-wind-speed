<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>محطة الطقس الرقمية</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            font-family: Arial, sans-serif;

            background-color: #121212;

            color: #ffffff;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

            margin: 0;

            transition:
                background-color 1s ease;

        }


        .card {

            background-color:
                rgba(30, 30, 30, 0.75);

            backdrop-filter:
                blur(10px);

            -webkit-backdrop-filter:
                blur(10px);

            padding: 50px 30px;

            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.5);

            border:
                1px solid rgba(255,255,255,0.1);

            width: 280px;

            position: relative;

        }


        h1 {

            font-size: 22px;

            margin:
                0 0 25px 0;

            color: #ffffff;

            font-weight: normal;

        }


        .temp-container {

            font-size: 72px;

            font-weight: bold;

            color: #ffffff;

            direction: ltr;

        }


        .unit {

            font-size: 32px;

            color: #cccccc;

            margin-left: 5px;

        }


        /* مؤشر الاتصال */

        .led-indicator {

            position: absolute;

            top: 20px;

            left: 20px;

            width: 12px;

            height: 12px;

            background-color: #444444;

            border-radius: 50%;

            transition:
                background-color 0.3s ease,
                box-shadow 0.3s ease;

        }


        /* اتصال ناجح */

        .led-success {

            background-color:
                #00ff66 !important;

            box-shadow:
                0 0 12px #00ff66;

        }
