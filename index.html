<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAMAH WIND SPEED</title>

<style>
body{
    margin:0;
    background:#07111f;
    color:white;
    font-family:Arial;
    text-align:center;
}

.container{
    max-width:600px;
    margin:auto;
    padding:30px 15px;
}

.card{
    background:#142337;
    border-radius:30px;
    padding:35px 20px;
    margin-top:25px;
}

h1{
    font-size:28px;
}

.speed{
    font-size:80px;
    font-weight:bold;
    margin:20px 0 5px;
}

.unit{
    color:#aebdce;
    font-size:20px;
}

.status{
    margin:25px auto;
    padding:12px 25px;
    border-radius:30px;
    background:#1d2c40;
    width:max-content;
    font-size:20px;
}

.online{
    color:#35e878;
}

.offline{
    color:#ff5555;
}

.update{
    color:#8291a5;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<h1>🌬️ RAMAH WIND SPEED</h1>

<div class="card">

<div>سرعة الرياح الحالية</div>

<div class="speed" id="speed">
--
</div>

<div class="unit">
km/h
</div>

<div class="status" id="status">
جاري الاتصال...
</div>

<div class="update" id="update">
آخر تحديث: --
</div>

</div>

</div>

<script>

const URL =
"https://api.thingspeak.com/channels/3455315/feeds/last.json";


async function readData(){

try{

const response =
await fetch(URL);

const data =
await response.json();

console.log(data);


/* Field 1 */

const wind =
parseFloat(data.field1);

if(!isNaN(wind)){

document.getElementById("speed")
.innerText =
wind.toFixed(1);

}


/* Field 2 */

const status =
parseFloat(data.field2);

if(status > 0){

document.getElementById("status")
.innerHTML =
"🟢 <span class='online'>متصل</span>";

}else{

document.getElementById("status")
.innerHTML =
"🔴 <span class='offline'>غير متصل</span>";

}


/* Time */

if(data.created_at){

const date =
new Date(data.created_at);

document.getElementById("update")
.innerText =
"آخر تحديث: " +
date.toLocaleTimeString("ar-SA");

}

}

catch(error){

console.log(error);

document.getElementById("status")
.innerHTML =
"🔴 <span class='offline'>خطأ في الاتصال</span>";

}

}


readData();

setInterval(
readData,
15000
);

</script>

</body>
</html>
