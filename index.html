<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAMAH WIND SPEED</title>

<style>
body{
    margin:0;
    background:#07111f;
    color:white;
    font-family:Arial;
    text-align:center;
}

.container{
    padding:40px 15px;
}

.card{
    max-width:500px;
    margin:30px auto;
    padding:40px 20px;
    background:#142337;
    border-radius:30px;
}

h1{
    font-size:30px;
}

.speed{
    font-size:80px;
    font-weight:bold;
    margin:20px;
}

.status{
    font-size:20px;
    margin:20px;
}

.online{
    color:#35e878;
}

.offline{
    color:#ff5555;
}

.update{
    color:#8291a5;
    font-size:14px;
}
</style>

</head>

<body>

<div class="container">

<h1>🌬️ RAMAH WIND SPEED</h1>

<div class="card">

<div>سرعة الرياح الحالية</div>

<div
class="speed"
id="speed">
--
</div>

<div>
km/h
</div>

<div
class="status"
id="status">
جاري الاتصال...
</div>

<div
class="update"
id="update">
آخر تحديث: --
</div>

</div>

</div>


<script>

const THINGSPEAK_URL =
"https://api.thingspeak.com/channels/3455315/feeds/last.json";


async function updateWeather(){

try{

const response =
await fetch(
THINGSPEAK_URL +
"?t=" +
Date.now()
);

if(!response.ok){

throw new Error(
"ThingSpeak HTTP error"
);

}

const data =
await response.json();


/* سرعة الرياح - Field 1 */

const speed =
parseFloat(
data.field1
);


if(!isNaN(speed)){

document.getElementById("speed")
.innerText =
speed.toFixed(1);

}


/* حالة الاتصال - Field 2 */

const status =
parseFloat(
data.field2
);


if(status > 0){

document.getElementById("status")
.innerHTML =
"🟢 <span class='online'>متصل</span>";

}
else{

document.getElementById("status")
.innerHTML =
"🔴 <span class='offline'>غير متصل</span>";

}


/* وقت آخر قراءة */

if(data.created_at){

const date =
new Date(
data.created_at
);

document.getElementById("update")
.innerText =
"آخر قراءة: " +
date.toLocaleTimeString(
"ar-SA"
);

}

}

catch(error){

console.log(error);

document.getElementById("status")
.innerHTML =
"🔴 <span class='offline'>خطأ في الاتصال</span>";

}

}


/* أول قراءة */

updateWeather();


/* تحديث كل 15 ثانية */

setInterval(
updateWeather,
15000
);

</script>

</body>

</html>
