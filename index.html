<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAMAH WIND SPEED</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Tahoma, sans-serif;
    background:
        radial-gradient(circle at top, #173452 0%, #07111f 55%, #040a12 100%);
    color: white;
}

.container {
    width: 100%;
    max-width: 720px;
    margin: auto;
    padding: 18px;
}

/* HEADER */

.header {
    text-align: center;
    padding: 18px 5px 12px;
}

.header .icon {
    font-size: 42px;
    margin-bottom: 5px;
}

.header h1 {
    margin: 0;
    font-size: 30px;
    letter-spacing: 1px;
}

.header p {
    margin: 8px 0 0;
    color: #9fb0c4;
    font-size: 15px;
}

/* MAIN SPEED CARD */

.speed-card {
    position: relative;
    overflow: hidden;
    text-align: center;
    margin-top: 18px;
    padding: 35px 20px 30px;

    background: rgba(18, 34, 53, 0.96);

    border: 1px solid rgba(255,255,255,0.08);

    border-radius: 30px;

    box-shadow:
        0 20px 50px rgba(0,0,0,0.35),
        inset 0 1px rgba(255,255,255,0.04);
}

.speed-card::before {
    content: "";
    position: absolute;

    width: 220px;
    height: 220px;

    border-radius: 50%;

    background: rgba(40, 220, 130, 0.08);

    top: -110px;
    left: 50%;

    transform: translateX(-50%);
}

.speed-label {
    position: relative;
    color: #9fb0c4;
    font-size: 18px;
}

.speed {
    position: relative;

    margin-top: 12px;

    font-size: 92px;
    line-height: 1;

    font-weight: bold;

    letter-spacing: -3px;
}

.unit {
    margin-top: 10px;

    color: #aebdce;

    font-size: 22px;
}

/* STATUS */

.status {
    display: inline-flex;
    align-items: center;
    gap: 9px;

    margin-top: 28px;

    padding: 11px 25px;

    border-radius: 40px;

    background: rgba(255,255,255,0.06);

    font-size: 19px;
}

.status-dot {
    width: 12px;
    height: 12px;

    border-radius: 50%;

    background: #35e878;

    box-shadow:
        0 0 10px rgba(53,232,120,0.8);
}

.online {
    color: #35e878;
    font-weight: bold;
}

.offline {
    color: #ff5555;
    font-weight: bold;
}

.offline-dot {
    background: #ff5555;

    box-shadow:
        0 0 10px rgba(255,85,85,0.8);
}

/* UPDATE */

.update {
    margin-top: 17px;

    color: #77889d;

    font-size: 14px;
}

/* CHART */

.chart-card {
    margin-top: 18px;

    padding: 22px 16px;

    background: rgba(18, 34, 53, 0.96);

    border: 1px solid rgba(255,255,255,0.08);

    border-radius: 30px;

    box-shadow:
        0 15px 40px rgba(0,0,0,0.28);
}

.chart-title {
    text-align: center;

    font-size: 19px;

    font-weight: bold;

    margin-bottom: 18px;

    color: #dbe6f2;
}

.chart-wrapper {
    width: 100%;
    height: 280px;
}

canvas {
    width: 100%;
    height: 100%;
}

/* FOOTER */

.footer {
    text-align: center;

    padding: 25px 0 10px;

    color: #596a7f;

    font-size: 13px;
}

/* MOBILE */

@media (max-width: 480px) {

    .container {
        padding: 12px;
    }

    .header h1 {
        font-size: 25px;
    }

    .header .icon {
        font-size: 36px;
    }

    .speed-card {
        padding: 30px 15px;
    }

    .speed {
        font-size: 72px;
    }

    .chart-wrapper {
        height: 240px;
    }

}

</style>

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="icon">🌬️</div>

        <h1>
            RAMAH WIND SPEED
        </h1>

        <p>
            محطة قياس سرعة الرياح - رماح
        </p>

    </div>


    <!-- SPEED -->

    <div class="speed-card">

        <div class="speed-label">
            سرعة الرياح الحالية
        </div>

        <div
            class="speed"
            id="windSpeed">
            --
        </div>

        <div class="unit">
            km/h
        </div>


        <!-- STATUS -->

        <div
            class="status"
            id="status">

            <span
                class="status-dot"
                id="statusDot">
            </span>

            <span id="statusText">
                جاري الاتصال...
            </span>

        </div>


        <div
            class="update"
            id="lastUpdate">

            آخر تحديث: --

        </div>

    </div>


    <!-- CHART -->

    <div class="chart-card">

        <div class="chart-title">

            📈 سرعة الرياح

        </div>

        <div class="chart-wrapper">

            <canvas
                id="windChart">
            </canvas>

        </div>

    </div>


    <div class="footer">

        RAMAH WIND SPEED

    </div>

</div>
