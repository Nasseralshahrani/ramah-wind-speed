<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>RAMAH WEATHER</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

min-height:100vh;

font-family:Arial,sans-serif;

background:
radial-gradient(
circle at top,
#173554 0%,
#08111f 45%,
#040912 100%
);

color:white;

display:flex;

justify-content:center;

align-items:center;

padding:20px;
}

.container{

width:100%;

max-width:500px;

text-align:center;
}

.title{

font-size:30px;

font-weight:bold;

letter-spacing:2px;

margin-bottom:8px;
}

.subtitle{

font-size:14px;

color:#9fb3c8;

margin-bottom:25px;
}

.card{

background:rgba(255,255,255,0.08);

border:1px solid rgba(255,255,255,0.12);

border-radius:22px;

padding:25px;

margin-bottom:15px;

box-shadow:
0 10px 35px rgba(0,0,0,0.35);

backdrop-filter:blur(10px);
}

.wind{

border:1px solid rgba(255,140,0,0.35);
}

.icon{

font-size:45px;

margin-bottom:8px;
}

.label{

font-size:15px;

color:#aebfd0;

margin-bottom:8px;
}

.value{

font-size:42px;

font-weight:bold;
}

.unit{

font-size:18px;

color:#aebfd0;

margin-right:5px;
}

.temperature{

font-size:30px;

font-weight:bold;
}

.humidity{

font-size:30px;

font-weight:bold;
}

.status{

display:flex;

justify-content:center;

align-items:center;

gap:8px;

margin-top:20px;

font-size:14px;

color:#aaa;
}

.dot{

width:10px;

height:10px;

border-radius:50%;

background:#777;

}

.online{

background:#00ff66;

box-shadow:
0 0 10px #00ff66;
}

.offline{

background:#ff3333;

box-shadow:
0 0 10px #ff3333;
}

.time{

margin-top:10px;

font-size:12px;

color:#718096;
}

</style>

</head>

<body>

<div class="container">

<div class="title">
RAMAH WEATHER
</div>

<div class="subtitle">
محطة رماح الرقمية
</div>


<!-- سرعة الرياح -->

<div class="card wind">

<div class="icon">
🌪️
</div>

<div class="label">
سرعة الرياح
</div>

<div>

<span
class="value"
id="windSpeed">
0.00
</span>

<span class="unit">
km/h
</span>

</div>

</div>


<!-- الحرارة -->

<div class="card">

<div class="icon">
🌡️
</div>

<div class="label">
درجة الحرارة
</div>

<div>

<span
class="temperature"
id="temperature">
-- 
</span>

<span class="unit">
°C
</span>

</div>

</div>


<!-- الرطوبة -->

<div class="card">

<div class="icon">
💧
</div>

<div class="label">
الر
