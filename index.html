<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>RAMAH WEATHER</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Tahoma,sans-serif;

    background:
    radial-gradient(
        circle at top,
        #173554 0%,
        #08111f 45%,
        #040912 100%
    );

    color:white;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;
}

.container{
    width:100%;
    max-width:600px;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.header h1{
    margin:0;
    font-size:32px;
    letter-spacing:2px;
}

.header p{
    margin-top:8px;
    color:#9fb3c8;
    font-size:15px;
}

.status{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-top:12px;

    font-size:14px;
    color:#9fb3c8;
}

.status-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#777;

    box-shadow:0 0 8px #777;
}

.status-dot.online{
    background:#00e676;
    box-shadow:0 0 12px #00e676;
}

.status-dot.offline{
    background:#ff1744;
    box-shadow:0 0 12px #ff1744;
}

.card{
    background:rgba(15,28,45,0.88);

    border:1px solid rgba(255,255,255,0.08);

    border-radius:22px;

    padding:30px 20px;

    box-shadow:
    0 15px 40px rgba(0,0,0,0.4);

    margin-bottom:18px;
}

.main-temperature{
    text-align:center;
}

.main-temperature .icon{
    font-size:55px;
}

.main-temperature .value{
    font-size:72px;
    font-weight:bold;
    margin-top:5px;
}

.main-temperature .unit{
    font-size:24px;
    color:#9fb3c8;
}

.label{
    color:#8fa5ba;
    font-size:15px;
    margin-top:5px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.small-card{
    background:rgba(255,255,255,0.04);

    border-radius:18px;

    padding:22px 15px;

    text-align:center;

    border:1px solid rgba(255,255,255,0.06);
}

.small-card .icon{
    font-size:32px;
}

.small-card .number{
    font-size:30px;
    font-weight:bold;
    margin-top:8px;
}

.small-card .title{
    color:#8fa5ba;
    font-size:14px;
    margin-top:5px;
}

.update{
    text-align:center;

    color:#71869b;

    font-size:13px;

    margin-top:20px;
}

.footer{
    text-align:center;

    color:#53677a;

    font-size:12px;

    margin-top:15px;
}

.error{
    text-align:center;

    color:#ff6b6b;

    font-size:14px;

    display:none;

    margin-top:15px;
}

@media(max-width:450px){

    .header h1{
        font-size:27px;
    }

    .main-temperature .value{
        font-size:60px;
    }

    .card{
        padding:25px 15px;
    }

}

</style>

</head>


<body>

<div class="container">

    <div class="header">

        <h1>RAMAH WEATHER</h1>

        <p>محطة رماح للطقس</p>

        <div class="status">

            <span
                id="statusDot"
                class="status-dot">
            </span>

            <span id="statusText">
                جاري الاتصال...
            </span>

        </div>

    </div>


    <!-- الحرارة -->

    <div class="card">

        <div class="main-temperature">

            <div class="icon">
                🌡️
            </div>

            <div
                id="temperature"
                class="value">
                -- 
            </div>

            <div class="unit">
                °C
            </div>

            <div class="label">
                درجة الحرارة بعد المعايرة
            </div>

        </div>

    </div>


    <!-- الرطوبة -->

    <div class="grid">

        <div class="small-card">

            <div class="icon">
                💧
            </div>

            <div
                id="humidity"
                class="number">
                --
            </div>

            <div class="title">
                الرطوبة %
            </div>

        </div>


        <div class="small-card">

            <div class="icon">
                📡
            </div>

            <div
                id="lastSeen"
                class="number">
                --
            </div>

            <div class="title">
                آخر تحديث
            </div>

        </div>

    </div>


    <div
        id="error"
        class="error">
        تعذر الاتصال ببيانات Firebase
    </div>


    <div
        id="updateTime"
        class="update">
        جاري تحميل البيانات...
    </div>


    <div class="footer">
        RAMAH WEATHER STATION
    </div>

</div>


<script>

const FIREBASE_URL =
"https://rumah-wind-default-rtdb.asia-southeast1.firebasedatabase.app/weather.json";


// ======================================
// قراءة Firebase
// ======================================

async function getWeather(){

    try{

        const response =
            await fetch(FIREBASE_URL + "?t=" + Date.now());

        if(!response.ok){

            throw new Error(
                "Firebase HTTP " + response.status
            );

        }

        const data =
            await response.json();


        if(!data){

            throw new Error(
                "لا توجد بيانات"
            );

        }


        // ==============================
        // الحرارة
        // ==============================

        if(
            typeof data.temperature === "number"
        ){

            document.getElementById(
                "temperature"
            ).textContent =
                data.temperature.toFixed(1);

        }


        // ==============================
        // الرطوبة
        // ==============================

        if(
            typeof data.humidity === "number"
        ){

            document.getElementById(
                "humidity"
            ).textContent =
                data.humidity.toFixed(1);

        }


        // ==============================
        // حالة الاتصال
        // ==============================

        const now =
            Date.now();

        const lastSeen =
            Number(data.lastSeen);


        /*
          lastSeen في ESP32 هو millis()
          لذلك لا يمكن استخدامه مباشرة
          لمعرفة وقت الإنترنت الحقيقي.

          لكن وصول البيانات الآن يعني
          أن Firebase يستجيب.
        */

        setOnline();


        // ==============================
        // وقت تحديث الموقع
        // ==============================

        const currentTime =
            new Date();

        document.getElementById(
            "updateTime"
        ).textContent =
            "آخر قراءة من Firebase: " +
            currentTime.toLocaleTimeString(
                "ar-SA"
            );


        document.getElementById(
            "lastSeen"
        ).textContent =
            "✓";


        document.getElementById(
            "error"
        ).style.display =
            "none";


    }catch(error){

        console.error(error);

        setOffline();

        document.getElementById(
            "error"
        ).style.display =
            "block";

    }

}


// ======================================
// متصل
// ======================================

function setOnline(){

    document.getElementById(
        "statusDot"
    ).className =
        "status-dot online";

    document.getElementById(
        "statusText"
    ).textContent =
        "المحطة متصلة";

}


// ======================================
// غير متصل
// ======================================

function setOffline(){

    document.getElementById(
        "statusDot"
    ).className =
        "status-dot offline";

    document.getElementById(
        "statusText"
    ).textContent =
        "لا يوجد اتصال";

}


// ======================================
// تشغيل أول قراءة
// ======================================

getWeather();


// ======================================
// تحديث كل 3 ثواني
// ======================================

setInterval(
    getWeather,
    3000
);

</script>

</body>

</html>
