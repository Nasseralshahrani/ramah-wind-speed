<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>RAMAH WEATHER</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;
font-family:Arial,sans-serif;

background:
radial-gradient(
circle at top,
#173554 0%,
#08111f 45%,
#040912 100%
);

color:white;

display:flex;
justify-content:center;
align-items:center;

transition:background 1s ease;
}

.card{

width:350px;

padding:30px 25px;

border-radius:25px;

text-align:center;

background:rgba(20,30,45,.82);

backdrop-filter:blur(12px);

-webkit-backdrop-filter:blur(12px);

border:1px solid rgba(255,255,255,.12);

box-shadow:0 15px 40px rgba(0,0,0,.5);

}

h1{

margin:0 0 8px;

font-size:28px;

}

.subtitle{

font-size:16px;

color:#aebdcc;

margin-bottom:25px;

}

.grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:12px;

}

.box{

padding:20px 8px;

border-radius:18px;

background:rgba(255,255,255,.06);

border:1px solid rgba(255,255,255,.08);

}

.label{

font-size:14px;

color:#aebdcc;

margin-bottom:10px;

}

.value{

font-size:34px;

font-weight:bold;

direction:ltr;

}

.wind{
color:#ffff00;
}

.temp{
color:#ff9d42;
}

.humidity{
color:#55c7ff;
}

.connection{
color:#00ff66;
font-size:22px;
}

.unit{

font-size:14px;

color:#bfc8d2;

}

.status{

margin-top:25px;

font-size:16px;

}

.led{

display:inline-block;

width:12px;

height:12px;

border-radius:50%;

background:#777;

margin-left:8px;

}

.connected{

background:#00ff66;

box-shadow:0 0 12px #00ff66;

}

.error{

background:#ff3333;

box-shadow:0 0 12px #ff3333;

}

.time{

margin-top:15px;

font-size:13px;

color:#aebdcc;

}

.info{

margin-top:15px;

font-size:12px;

color:#718096;

}

</style>

</head>


<body>


<div class="card">


<h1>
RAMAH WEATHER
</h1>


<div class="subtitle">
محطة رماح للطقس
</div>


<div class="grid">


<!-- سرعة الرياح -->

<div class="box">

<div class="label">
🌪️ سرعة الرياح
</div>

<div>

<span
id="windSpeed"
class="value wind">
--
</span>

<span class="unit">
km/h
</span>

</div>

</div>


<!-- الحرارة -->

<div class="box">

<div class="label">
🌡️ الحرارة
</div>

<div>

<span
id="temperature"
class="value temp">
--
</span>

<span class="unit">
°C
</span>

</div>

</div>


<!-- الرطوبة -->

<div class="box">

<div class="label">
💧 الرطوبة
</div>

<div>

<span
id="humidity"
class="value humidity">
--
</span>

<span class="unit">
%
</span>

</div>

</div>


<!-- الاتصال -->

<div class="box">

<div class="label">
📡 الاتصال
</div>

<div
id="connection"
class="value connection">

--

</div>

</div>


</div>


<!-- حالة الاتصال -->

<div class="status">

<span
id="led"
class="led">
</span>

<span id="status">
جاري الاتصال...
</span>

</div>


<!-- آخر قراءة -->

<div
id="time"
class="time">

آخر قراءة: --

</div>


<div class="info">
Firebase Live Data
</div>


</div>
