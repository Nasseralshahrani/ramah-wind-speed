<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAMAH WIND SPEED</title>

<style>

body{
    margin:0;
    background:#07111f;
    color:white;
    font-family:Arial,Tahoma,sans-serif;
    text-align:center;
}

.container{
    max-width:700px;
    margin:auto;
    padding:20px 15px;
}

.card{
    background:#142337;
    border-radius:28px;
    padding:30px 20px;
    margin-top:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

h1{
    font-size:29px;
    margin:10px 0;
}

.label{
    color:#aebdce;
    font-size:18px;
}

.speed{
    font-size:78px;
    font-weight:bold;
    margin:15px 0 0;
}

.unit{
    color:#aebdce;
    font-size:20px;
}

.status{
    margin:25px auto 15px;
    padding:11px 25px;
    border-radius:30px;
    background:#1d2c40;
    width:max-content;
    font-size:19px;
}

.online{
    color:#35e878;
}

.offline{
    color:#ff5555;
}

.update{
    color:#8291a5;
    font-size:14px;
}

.chart-card{
    background:#142337;
    border-radius:28px;
    padding:22px 12px;
    margin-top:20px;
}

.chart-title{
    font-size:19px;
    margin-bottom:15px;
}

canvas{
    width:100%;
    height:280px;
    display:block;
}

.footer{
    color:#68788d;
    font-size:13px;
    margin:25px 0 10px;
}

</style>

</head>


<body>

<div class="container">

<h1>🌬️ RAMAH WIND SPEED</h1>


<!-- CURRENT SPEED -->

<div class="card">

<div class="label">
سرعة الرياح الحالية
</div>

<div
id="speed"
class="speed">
--
</div>

<div class="unit">
km/h
</div>

<div
id="status"
class="status">
جاري الاتصال...
</div>

<div
id="update"
class="update">
آخر قراءة: --
</div>

</div>


<!-- CHART -->

<div class="chart-card">

<div class="chart-title">
📈 سجل سرعة الرياح
</div>

<canvas id="chart"></canvas>

</div
