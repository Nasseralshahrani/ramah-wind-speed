<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAMAH WEATHER</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    color:#fff;
    background:
        radial-gradient(
            circle at 50% -10%,
            #0d4355 0%,
            #062b3a 30%,
            #031b27 65%,
            #02131c 100%
        );
    transition:background 1s ease;
}

.page{
    width:100%;
    max-width:820px;
    margin:auto;
    padding:18px 14px 35px;
}


/* ==============================
   HEADER
============================== */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
}

.header-right{
    text-align:right;
}

.header-small{
    color:#7fc5d5;
    font-size:21px;
    font-weight:bold;
    margin-bottom:4px;
}

.header-city{
    font-size:45px;
    font-weight:bold;
    line-height:1;
}

.weather-logo{
    width:78px;
    height:78px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:48px;
    background:rgba(4,37,53,.8);
    border:2px solid #157ba0;
    box-shadow:0 0 22px rgba(0,160,210,.18);
}


/* ==============================
   CONTROLS
============================== */

.controls{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.circle-button{
    width:66px;
    height:66px;
    flex-shrink:0;
    border-radius:50%;
    border:2px solid rgba(80,180,210,.28);
    background:rgba(5,43,58,.75);
    color:#71cde5;
    font-size:29px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.pin-button{
    height:66px;
    padding:0 28px;
    border:0;
    border-radius:38px;
    background:#55c6e4;
    color:#062333;
    font-size:19px;
    font-weight:bold;
}


/* ==============================
   WARNING
============================== */

.warning{
    display:flex;
    align-items:center;
    justify-content:space-between;
    min-height:94px;
    padding:15px 18px;
    margin-bottom:18px;
    border-radius:24px;
    background:
        linear-gradient(
            90deg,
            #633200,
            #704000
        );
    border:2px solid rgba(218,151,54,.5);
    box-shadow:0 5px 20px rgba(0,0,0,.2);
}

.warning-text{
    text-align:right;
    flex:1;
}

.warning-title{
    font-size:25px;
    font-weight:bold;
    color:#ffe0ad;
}

.warning-subtitle{
    margin-top:5px;
    color:#e4c59b;
    font-size:15px;
}

.warning-icon{
    width:58px;
    height:58px;
    border-radius:50%;
    background:rgba(255,220,160,.12);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:31px;
    margin-right:12px;
}


/* ==============================
   MAIN WEATHER CARD
============================== */

.main-weather{
    position:relative;
    overflow:hidden;
    min-height:405px;
    border-radius:45px;
    background:
        linear-gradient(
            135deg,
            #eef3e7 0%,
            #dce8dc 48%,
            #c4d9d5 100%
        );
    color:#062536;
    border:1px solid rgba(255,255,255,.35);
    box-shadow:0 12px 35px rgba(0,0,0,.25);
    margin-bottom:22px;
}

.main-top{
    display:flex;
    justify-content:space-between;
    padding:35px 28px 10px;
}

.main-location{
    font-size:21px;
    font-weight:bold;
}

.main-status{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 17px;
    border-radius:25px;
    background:#ffd2ce;
    color:#a32828;
    font-size:17px;
    font-weight:bold;
}

.status-dot{
    width:13px;
    height:13px;
    border-radius:50%;
    background:#ff3030;
}

.main-content{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 35px 35px;
}

.weather-symbol{
    font-size:105px;
    width:42%;
    text-align:center;
}

.main-info{
    width:55%;
    text-align:right;
}

.big-temperature{
    font-size:105px;
    font-weight:bold;
    line-height:.95;
    color:#062b3d;
}

.degree{
    font-size:32px;
    vertical-align:top;
}

.weather-description{
    font-size:31px;
    font-weight:bold;
    margin-top:12px;
}

.feels{
    font-size:18px;
    color:#526d78;
    margin-top:8px;
}

.main-date{
    font-size:21px;
    font-weight:bold;
    margin-top:23px;
}

.wind-strip{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:69px;
    background:#27647a;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap:15px;
    padding:0 25px;
    font-size:19px;
    font-weight:bold;
}

.wind-direction{
    width:47px;
    height:47px;
    border-radius:50%;
    background:#8fd3e7;
    color:#092d40;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}


/* ==============================
   SENSOR CARDS
============================== */

.sensor-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:15px;
}

.sensor-card{
    min-height:165px;
    border-radius:25px;
    border:2px solid rgba(80,174,205,.16);
    background:rgba(5,40,54,.78);
    padding:18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.sensor-info{
