<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>RAMAH WIND SPEED</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

min-height:100vh;

font-family:Arial,sans-serif;

background:
radial-gradient(
circle at top,
#173554 0%,
#08111f 45%,
#040912 100%
);

color:white;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

transition:background 1s ease;

}

.card{

width:100%;

max-width:360px;

padding:35px 25px;

border-radius:25px;

text-align:center;

background:rgba(20,30,45,.82);

backdrop-filter:blur(12px);

-webkit-backdrop-filter:blur(12px);

border:1px solid rgba(255,255,255,.12);

box-shadow:0 15px 40px rgba(0,0,0,.5);

}

h1{

margin:0 0 8px;

font-size:27px;

}

.subtitle{

font-size:16px;

color:#aebdcc;

margin-bottom:25px;

}

.speed{

font-size:70px;

font-weight:bold;

line-height:1;

direction:ltr;

color:#ffff00;

text-shadow:
0 0 10px rgba(255,255,0,.25);

}

.unit{

font-size:25px;

color:#bfc8d2;

margin-right:8px;

}

.status{

margin-top:25px;

font-size:16px;

}

.led{

display:inline-block;

width:12px;

height:12px;

border-radius:50%;

background:#777;

margin-left:8px;

}

.connected{

background:#00ff66;

box-shadow:0 0 12px #00ff66;

}

.error{

background:#ff3333;

box-shadow:0 0 12px #ff3333;

}

.time{

margin-top:15px;

font-size:13px;

color:#aebdcc;

}

.info{

margin-top:15px;

font-size:12px;

color:#718096;

}


/* ==============================
   WEATHER
============================== */

.weather{

margin-top:25px;

display:grid;

grid-template-columns:1fr 1fr;

gap:12px;

}

.weather-box{

padding:18px 10px;

border-radius:18px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

}

.weather-icon{

font-size:28px;

margin-bottom:5px;

}

.weather-value{

font-size:30px;

font-weight:bold;

direction:ltr;

}

.weather-label{

font-size:13px;

color:#aebdcc;

margin-top:5px;

}

.weather-status{

margin-top:12px;

font-size:12px;

color:#718096;

}

</style>

</head>


<body>


<div class="card">


<h1>
RAMAH WIND SPEED
</h1>


<div class="subtitle">
سرعة الرياح الحالية
</div>


<!-- ==============================
     WIND SPEED
============================== -->

<div>

<span
id="speed"
class="speed">
--
</span>

<span class="unit">
km/h
</span>

</div>


<!-- ==============================
     CONNECTION
============================== -->

<div class="status">

<span
id="led"
class="led">
</span>

<span id="status">
جاري الاتصال...
</span>

</div>


<div
id="time"
class="time">

آخر قراءة: --

</div>


<!-- ==============================
     WEATHER
============================== -->

<div class="weather">


<div class="weather-box">

<div class="weather-icon">
🌡️
</div>

<div
id="temperature"
class="weather-value">

--

</div>

<div class="weather-label">
درجة الحرارة °C
</div>

</div>


<div class="weather-box">

<div class="weather-icon">
💧
</div>

<div
id="humidity"
class="weather-value">

--

</div>

<div class="weather-label">
الرطوبة %
</div>

</div>


</div>


<div
id="weatherStatus"
class="weather-status">

جاري قراءة بيانات الطقس...

</div>


<div class="info">
Firebase Live Data
</div>


</div>


<script>


// ======================================
// Firebase
// ======================================

const FIREBASE_URL =
"https://rumah-wind-default-rtdb.asia-southeast1.firebasedatabase.app";


// ======================================
// آخر سرعة رياح
// ======================================

let lastRPM = null;


// ======================================
// قراءة Firebase
// ======================================

async function getWindSpeed(){

try{


const response =
await fetch(

FIREBASE_URL +
"/.json?_=" +
Date.now(),

{
method:"GET",
cache:"no-store"
}

);


if(!response.ok){

throw new Error(
"HTTP " +
response.status
);

}


const data =
await response.json();


console.log(
"Firebase:",
data
);


// ======================================
// WIND SPEED
// ======================================

const rpm =
parseFloat(
data.windSpeed
);


if(!Number.isNaN(rpm)){

lastRPM = rpm;


document.getElementById(
"speed"
).textContent =
rpm.toFixed(1);


// ======================================
// تغيير الخلفية حسب السرعة
// ======================================

if(rpm <= 10){

document.body.style.background =
"radial-gradient(circle at top,#173554 0%,#08111f 45%,#040912 100%)";

}

else if(rpm <= 30){

document.body.style.background =
"radial-gradient(circle at top,#14532d 0%,#071a12 50%,#030806 100%)";

}

else if(rpm <= 60){

document.body.style.background =
"radial-gradient(circle at top,#7c431c 0%,#241206 50%,#080402 100%)";

}

else{

document.body.style.background =
"radial-gradient(circle at top,#7f1d1d 0%,#250606 50%,#080101 100%)";

}

}


// ======================================
// WIND CONNECTION
// ======================================

const lastSeen =
Number(
data.lastSeen
);


if(lastSeen){

const now =
Date.now();

const age =
now - lastSeen;


console.log(
"Wind lastSeen:",
age,
"ms"
);


if(age <= 15000){

document.getElementById(
"status"
).textContent =
"متصل";

document.getElementById(
"led"
).className =
"led connected";

}

else{

document.getElementById(
"status"
).textContent =
"غير متصل";

document.getElementById(
"led"
).className =
"led error";

}


document.getElementById(
"time"
).textContent =
"آخر قراءة: " +

new Date(
lastSeen
).toLocaleTimeString(
"ar-SA",
{
hour:"2-digit",
minute:"2-digit",
second:"2-digit"
}
);

}


// ======================================
// WEATHER
// ======================================

if(data.weather){

const weather =
data.weather;


// --------------------------------------
// Temperature
// --------------------------------------

if(
typeof weather.temperature ===
"number"
){

document.getElementById(
"temperature"
).textContent =
weather.temperature.toFixed(1);

}


// --------------------------------------
// Humidity
// --------------------------------------

if(
typeof weather.humidity ===
"number"
){

document.getElementById(
"humidity"
).textContent =
weather.humidity.toFixed(1);

}


// --------------------------------------
// Weather status
// --------------------------------------

document.getElementById(
"weatherStatus"
).textContent =
"بيانات الطقس محدثة";

}


}


// ======================================
// ERROR
// ======================================

catch(error){


console.error(
"Firebase:",
error
);


if(lastRPM !== null){

document.getElementById(
"speed"
).textContent =
lastRPM.toFixed(1);

}


document.getElementById(
"status"
).textContent =
"غير متصل";


document.getElementById(
"led"
).className =
"led error";


document.getElementById(
"weatherStatus"
).textContent =
"تعذر قراءة بيانات الطقس";


}

}


// ======================================
// تشغيل
// ======================================

getWindSpeed();


// ======================================
// تحديث كل ثانيتين
// ======================================

setInterval(
getWindSpeed,
2000
);


</script>


</body>

</html>
